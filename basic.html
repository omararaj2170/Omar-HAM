
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmarTalk Basic</title>
<style>
.hidden { display: none; }
</style>
</head>
<body>

<h1>OmarTalk Basic</h1>

<label>Frequency (MHz)</label>
<input id="frequency" type="number" min="1" max="1000"
step="0.001" value="145.500">

<br><br>

<label>Transmission Method</label>
<select id="mode">
<option value="voice">Voice</option>
<option value="morse">Morse</option>
</select>

<br><br>

<button id="joinButton">Join Frequency</button>
<button id="leaveButton" class="hidden">Leave Frequency</button>

<p id="status">Disconnected</p>

<h3>Participants</h3>
<p id="participantCount">0 / 4 remote participants</p>
<ul id="participants"></ul>

<div id="voicePanel" class="hidden">
<h3>Voice</h3>
<button id="pttButton" disabled>HOLD TO TALK</button>
</div>

<div id="morsePanel" class="hidden">
<h3>Morse</h3>
<input id="morseInput" maxlength="100"
placeholder="Type message">
<button id="sendMorseButton">Transmit Morse</button>
<p id="encodedPreview">...</p>
</div>

<h3>Received Morse</h3>
<div id="receivedMorse">
Waiting for messages...
</div>

<h3>Audio</h3>
<button id="enableAudioButton">Enable Audio</button>
<div id="remoteAudio"></div>

<p><a href="index.html">Back to OmarTalk</a></p>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>
(async function() {
    try {
        const response = await fetch("index.html", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Could not load index.html");
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(
            html, "text/html"
        );

        const scripts = Array.from(doc.scripts);
        const radioScript = scripts.find(
            s => !s.src && s.textContent.includes("joinFrequency")
        );

        if (!radioScript) {
            throw new Error("Radio engine not found");
        }

        const script = document.createElement("script");
        script.textContent = radioScript.textContent;
        document.body.appendChild(script);

    } catch (error) {
        document.getElementById("status").textContent =
            "Startup error: " + error.message;
    }
})();
</script>

</body>
</html>
